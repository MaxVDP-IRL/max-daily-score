<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0b0c" />
  <title>Max - Daily Score</title>

  <!-- PWA meta -->
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <style>
    :root{
      --bg:#0b0b0c;
      --panel:#121214;
      --text:#f3f3f4;
      --muted:#b5b5ba;
      --good:#1f9d55;
      --bad:#d64545;
      --warn:#d3a22f;
      --shadow: 0 12px 30px rgba(0,0,0,.35);
      --r:16px;
      --pad:16px;
      --tap:56px;
      --font: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:var(--font);
      background: radial-gradient(1200px 900px at 30% -10%, rgba(255,255,255,.06), transparent 60%),
                  radial-gradient(900px 800px at 90% 10%, rgba(255,255,255,.05), transparent 55%),
                  var(--bg);
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }
    header{
      position:sticky; top:0; z-index:10;
      backdrop-filter: blur(10px);
      background: rgba(11,11,12,.7);
      border-bottom:1px solid rgba(255,255,255,.06);
    }
    .wrap{max-width:880px;margin:0 auto;padding:14px 14px 24px}
    .top{
      display:flex; align-items:flex-end; justify-content:space-between;
      gap:12px;
    }
    h1{
      font-size:18px; margin:0; letter-spacing:.2px;
    }
    .date{
      font-size:12px; color:var(--muted); margin-top:4px;
    }
    .day-nav{
      display:flex; align-items:stretch; gap:8px;
      margin-bottom:14px;
    }
    .day-arrow{
      width:52px; min-height:52px; flex:0 0 52px;
      padding:0; font-size:28px; line-height:1;
      border-radius:14px;
      touch-action:manipulation;
    }
    .day-arrow:disabled{
      opacity:.32; cursor:default;
    }
    .day-label{
      flex:1; min-width:0;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      gap:2px; min-height:52px; padding:6px 10px;
      border-radius:14px;
      background:transparent;
      border:1px solid transparent;
      color:var(--text);
      text-align:center;
    }
    button.day-label{
      border-color: rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      cursor:pointer;
      touch-action:manipulation;
    }
    .day-nav-title{
      font-size:16px; font-weight:700; letter-spacing:.2px;
    }
    .day-nav-sub{
      font-size:12px; color:var(--muted); line-height:1.3;
    }
    .pill{ touch-action:manipulation; }
    .actions{
      display:flex; gap:8px; align-items:center;
    }
    button{
      appearance:none; border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
      color:var(--text);
      border-radius:12px;
      padding:10px 12px;
      font-size:13px;
      line-height:1;
      cursor:pointer;
      user-select:none;
    }
    button:active{transform:translateY(1px)}
    .btn-danger{
      border-color: rgba(214,69,69,.45);
      background: rgba(214,69,69,.12);
    }
    main{padding:18px 14px 36px}
    .grid{
      max-width:880px; margin:0 auto;
      display:grid; grid-template-columns: 1.1fr .9fr;
      gap:14px;
    }
    @media (max-width:860px){
      .grid{grid-template-columns:1fr}
    }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
      border:1px solid rgba(255,255,255,.08);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .card h2{
      margin:0; font-size:14px; letter-spacing:.2px;
      padding:14px var(--pad);
      border-bottom:1px solid rgba(255,255,255,.07);
      color: #e9e9ee;
    }
    .card .content{padding: var(--pad)}
    .kpis{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }
    .kpi{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px;
      padding:12px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.20);
      min-height: var(--tap);
    }
    .kpi .label{
      display:flex; flex-direction:column; gap:4px;
    }
    .kpi .title{font-size:14px}
    .kpi .desc{font-size:12px; color:var(--muted)}
    .toggle{
      display:flex; gap:8px; flex:0 0 auto;
    }
    .pill{
      min-width:64px;
      height:40px;
      padding:0 12px;
      display:flex; align-items:center; justify-content:center;
      border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.03);
      font-weight:600;
      font-size:13px;
    }
    .pill.good{border-color: rgba(31,157,85,.55); background: rgba(31,157,85,.16); color:#dff6e8}
    .pill.bad{border-color: rgba(214,69,69,.55); background: rgba(214,69,69,.14); color:#ffe6e6}
    .pill.off{opacity:.55}
    .summary{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
    }
    .stat{
      border:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.18);
      border-radius: 14px;
      padding:12px;
      min-height:74px;
    }
    .stat .big{
      font-size:24px;
      font-weight:800;
      letter-spacing:.3px;
    }
    .stat .small{
      margin-top:6px;
      font-size:12px;
      color:var(--muted);
    }
    .history{
      display:flex; flex-direction:column; gap:10px;
    }
    .row{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      padding:10px 12px;
      border-radius: 14px;
      border:1px solid rgba(255,255,255,.08);
      background: rgba(0,0,0,.18);
    }
    .row.viewing{ border-color: rgba(255,255,255,.32); }
    .row .left{
      display:flex; flex-direction:column; gap:4px;
      min-width: 0;
    }
    .row .d{font-size:13px; color:#e8e8ee}
    .row .hint{font-size:12px; color:var(--muted)}
    .dots{
      display:flex; gap:6px; flex-wrap:nowrap;
    }
    .dot{
      width:12px; height:12px; border-radius: 999px;
      border:1px solid rgba(255,255,255,.10);
      background: rgba(255,255,255,.04);
    }
    .dot.good{background: rgba(31,157,85,.9); border-color: rgba(31,157,85,.9)}
    .dot.bad{background: rgba(214,69,69,.9); border-color: rgba(214,69,69,.9)}
    .dot.miss{background: rgba(211,162,47,.9); border-color: rgba(211,162,47,.9)}
    .note{
      margin-top:10px;
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
    }
    .foot{
      margin-top:12px;
      display:flex; gap:8px; flex-wrap:wrap;
    }
    .foot input{
      flex:1;
      min-width: 200px;
      background: rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 12px;
      padding:10px 12px;
      color: var(--text);
      font-size:13px;
      outline:none;
    }
    .mono{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;}
    .toast{
      position: fixed; left:50%; transform: translateX(-50%);
      bottom: 18px;
      background: rgba(18,18,20,.92);
      border:1px solid rgba(255,255,255,.10);
      border-radius: 999px;
      padding:10px 14px;
      font-size:13px;
      color: var(--text);
      box-shadow: var(--shadow);
      opacity:0; pointer-events:none;
      transition: opacity .18s ease;
    }
    .toast.show{opacity:1}
  </style>
</head>

<body>
  <header>
    <div class="wrap">
      <div class="top">
        <div>
          <h1>Daily Score</h1>
          <div class="date" id="todayLine"></div>
        </div>
        <div class="actions">
          <button id="exportBtn" class="mono" title="Export JSON">Export</button>
          <button id="importBtn" class="mono" title="Import JSON">Import</button>
          <button id="resetBtn" class="btn-danger mono" title="Danger: clears all data">Reset</button>
        </div>
      </div>
    </div>
  </header>

  <main>
    <div class="grid">
      <section class="card">
        <h2 id="logHeading">Today (tap fast, close app)</h2>
        <div class="content">
          <div class="day-nav" id="dayNav"></div>
          <div class="kpis" id="kpiList"></div>
          <div class="note" id="dayNote">
            Inputs are binary. No journaling. Save happens instantly.
          </div>
        </div>
      </section>

      <section class="card">
        <h2>Scoreboard</h2>
        <div class="content">
          <div class="summary">
            <div class="stat">
              <div class="big" id="weekScore">-</div>
              <div class="small">This week (Mon-Sun)</div>
            </div>
            <div class="stat">
              <div class="big" id="rollScore">-</div>
              <div class="small">Rolling 28-day average</div>
            </div>
          </div>

          <div class="note">
            Missing day = amber. No resets.
          </div>

          <div style="height:12px"></div>

          <div class="history" id="history"></div>

          <div class="foot">
            <input id="dataBox" class="mono" placeholder="Paste JSON here to import (then press Import)" />
          </div>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast"></div>

<script type="module">
import {
  STORAGE_KEY,
  tallinnISO,
  prettyDate,
  isoAddDays,
  daysBefore,
  activeGoals,
  dayScore,
  isComplete,
  weekScore,
  rolling28,
  canLogDate,
  applyGoal,
} from "./logic.js";

let viewDate = tallinnISO();

function getTodayISO(){ return tallinnISO(); }

function toast(msg){
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1200);
}

function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return { days:{} };
    const data = JSON.parse(raw);
    if(!data || typeof data !== "object") return { days:{} };
    if(!data.days || typeof data.days !== "object") data.days = {};
    return data;
  }catch(e){
    return { days:{} };
  }
}

function save(data){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function ensureToday(data){
  const iso = getTodayISO();
  if(!data.days[iso]){
    data.days[iso] = { ts: Date.now(), v: {} };
    save(data);
  }
}

function showDate(iso){
  const today = getTodayISO();
  if(!canLogDate(iso, today)) return;
  viewDate = iso;
  renderAll(load());
}

function commitGoal(goalId, value){
  const today = getTodayISO();
  const result = applyGoal(load(), viewDate, goalId, value, today, Date.now());
  if(!result.ok) return;
  save(result.data);
  renderAll(result.data);
  toast("Saved");
}

const kpiList = document.getElementById("kpiList");
const historyEl = document.getElementById("history");
const todayLine = document.getElementById("todayLine");
const dayNav = document.getElementById("dayNav");

function dayNavText(iso, today){
  const dateText = prettyDate(iso);
  if(iso === today) return { title: "Today", sub: dateText };
  if(iso === isoAddDays(today, -1)) return { title: "Yesterday", sub: `${dateText} · tap for today` };
  const n = daysBefore(iso, today);
  const unit = n === 1 ? "day" : "days";
  return { title: dateText, sub: `${n} ${unit} ago · tap for today` };
}

function renderDayNav(){
  const today = getTodayISO();
  const onToday = viewDate === today;
  const label = dayNavText(viewDate, today);
  dayNav.replaceChildren();

  const prev = document.createElement("button");
  prev.type = "button";
  prev.className = "day-arrow";
  prev.id = "day-prev";
  prev.setAttribute("aria-label", "Previous day");
  prev.textContent = "‹";
  prev.addEventListener("click", () => showDate(isoAddDays(viewDate, -1)));

  const center = document.createElement(onToday ? "div" : "button");
  center.className = "day-label";
  center.id = "day-label";
  if(!onToday){
    center.type = "button";
    center.setAttribute("aria-label", "Return to today");
    center.addEventListener("click", () => showDate(today));
  }
  const title = document.createElement("span");
  title.className = "day-nav-title";
  title.textContent = label.title;
  const sub = document.createElement("span");
  sub.className = "day-nav-sub";
  sub.textContent = label.sub;
  center.append(title, sub);

  const next = document.createElement("button");
  next.type = "button";
  next.className = "day-arrow";
  next.id = "day-next";
  next.setAttribute("aria-label", "Next day");
  next.textContent = "›";
  next.disabled = onToday;
  next.addEventListener("click", () => {
    const now = getTodayISO();
    if(viewDate >= now) return;
    showDate(isoAddDays(viewDate, 1));
  });

  dayNav.append(prev, center, next);
}

function renderKpis(data){
  kpiList.replaceChildren();
  const today = getTodayISO();
  const onToday = viewDate === today;
  const entry = data.days[viewDate] || { v:{} };
  const goals = activeGoals(viewDate);
  const score = dayScore(viewDate, entry);

  todayLine.textContent = `${prettyDate(today)} - Tallinn time`;
  document.getElementById("logHeading").textContent = onToday
    ? "Today (tap fast, close app)"
    : "Earlier day";

  const note = document.getElementById("dayNote");
  note.textContent = onToday
    ? `This day ${score.num}/${score.denom}. Inputs are binary. Save happens instantly.`
    : `This day ${score.num}/${score.denom}. Edits save to ${prettyDate(viewDate)}. Tap the date to return to today.`;

  for(const goal of goals){
    const row = document.createElement("div");
    row.className = "kpi";

    const left = document.createElement("div");
    left.className = "label";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = goal.title;
    const desc = document.createElement("div");
    desc.className = "desc";
    desc.textContent = goal.desc;
    left.append(title, desc);

    const toggle = document.createElement("div");
    toggle.className = "toggle";

    const yes = document.createElement("div");
    yes.className = "pill";
    yes.textContent = "YES";

    const no = document.createElement("div");
    no.className = "pill";
    no.textContent = "NO";

    const val = entry.v?.[goal.id];
    if(val === true){
      yes.classList.add("good");
      no.classList.add("off");
    }else if(val === false){
      no.classList.add("bad");
      yes.classList.add("off");
    }else{
      yes.classList.add("off");
      no.classList.add("off");
    }

    yes.addEventListener("click", () => commitGoal(goal.id, true));
    no.addEventListener("click", () => commitGoal(goal.id, false));

    toggle.append(yes, no);
    row.append(left, toggle);
    kpiList.append(row);
  }
}

function renderScores(data){
  const today = getTodayISO();
  const wk = weekScore(data, today);
  const wkPct = wk.totalDen ? Math.round(100 * wk.totalNum / wk.totalDen) : 0;
  document.getElementById("weekScore").textContent = `${wk.totalNum}/${wk.totalDen} (${wkPct}%)`;

  const rolling = rolling28(data, today);
  document.getElementById("rollScore").textContent = `${Math.round(rolling * 100)}%`;
}

function renderHistory(data){
  historyEl.replaceChildren();
  const today = getTodayISO();

  for(let i = 0; i < 14; i++){
    const iso = isoAddDays(today, -i);
    const entry = data.days[iso];
    const exists = !!entry;
    const complete = exists && isComplete(iso, entry);
    const score = dayScore(iso, entry || { v:{} });
    const pct = score.denom ? Math.round(100 * score.num / score.denom) : 0;

    const row = document.createElement("div");
    row.className = "row";
    if(iso === viewDate) row.classList.add("viewing");

    const left = document.createElement("div");
    left.className = "left";

    let hint = "";
    if(!exists) hint = "Missing (treated as 0%)";
    else if(!complete) hint = `Incomplete · ${score.num}/${score.denom}`;
    else hint = `${score.num}/${score.denom} (${pct}%)`;

    const dateEl = document.createElement("div");
    dateEl.className = "d";
    dateEl.textContent = prettyDate(iso);
    const hintEl = document.createElement("div");
    hintEl.className = "hint";
    hintEl.textContent = hint;
    left.append(dateEl, hintEl);

    const dots = document.createElement("div");
    dots.className = "dots";
    for(const goal of activeGoals(iso)){
      const dot = document.createElement("div");
      dot.className = "dot";
      dot.title = goal.title;
      if(!exists){
        dot.classList.add("miss");
      }else{
        const value = entry.v?.[goal.id];
        if(value === true) dot.classList.add("good");
        else if(value === false) dot.classList.add("bad");
        else dot.classList.add("miss");
      }
      dots.append(dot);
    }

    row.append(left, dots);
    historyEl.append(row);
  }
}

function renderAll(data){
  const today = getTodayISO();
  if(!canLogDate(viewDate, today)) viewDate = today;
  renderDayNav();
  renderKpis(data);
  renderScores(data);
  renderHistory(data);
}

document.getElementById("exportBtn").addEventListener("click", async () => {
  const data = load();
  const json = JSON.stringify(data);
  document.getElementById("dataBox").value = json;
  try{
    if(navigator.clipboard) await navigator.clipboard.writeText(json);
    toast("Copied JSON");
  }catch(e){
    toast("Exported");
  }
});

document.getElementById("importBtn").addEventListener("click", () => {
  const box = document.getElementById("dataBox");
  const txt = box.value.trim();
  if(!txt){ toast("Paste JSON first"); return; }
  try{
    const parsed = JSON.parse(txt);
    if(!parsed || typeof parsed !== "object" || !parsed.days) throw new Error("Bad format");
    localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
    const data = load();
    ensureToday(data);
    const today = getTodayISO();
    if(!canLogDate(viewDate, today)) viewDate = today;
    renderAll(data);
    toast("Imported");
  }catch(e){
    toast("Import failed");
  }
});

document.getElementById("resetBtn").addEventListener("click", () => {
  const ok = confirm("This clears all data. Continue?");
  if(!ok) return;
  localStorage.removeItem(STORAGE_KEY);
  const data = load();
  ensureToday(data);
  renderAll(data);
  toast("Reset");
});

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState !== "visible") return;
  const today = getTodayISO();
  if(viewDate > today) viewDate = today;
  const data = load();
  ensureToday(data);
  renderAll(data);
});

if("serviceWorker" in navigator){
  if(navigator.serviceWorker.controller){
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      window.location.reload();
    });
  }
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

const data = load();
ensureToday(data);
renderAll(data);
</script>
</body>
</html>
